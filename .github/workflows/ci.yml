name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, build and drive the app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the web bundle
        run: npm run build

      - name: Install a browser for the smoke test
        run: npx playwright install --with-deps chromium

      # Drives the exported app the way the WebView does: saves a recipe to
      # on-device storage, reads it back after a reload, and builds a grocery
      # list from it.
      - name: Drive the app
        run: npm run smoke

  apk:
    name: Build the Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Exports the UI to out/, then copies it into the Android project.
      - name: Build the web bundle and sync it into Android
        run: npm run sync:android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/ladle-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ladle-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports/
          retention-days: 5
          if-no-files-found: ignore
