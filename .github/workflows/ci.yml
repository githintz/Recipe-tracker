name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, build and run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is what Next 15 requires; the upper is current.
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # better-sqlite3 ships prebuilt binaries; `npm ci` falls back to
      # compiling from source if none match, which needs no extra packages on
      # ubuntu-latest.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Boots the built app against a throwaway database and exercises the
      # pages, the import parser, recipe CRUD, folders and grocery merging.
      # No API key: the offline parsers have to carry this on their own.
      - name: Run the app and smoke test it
        run: npm run smoke

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ matrix.node-version }}
          path: .next/
          retention-days: 3
          if-no-files-found: ignore
